<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliotheca Obscura — Dark Academia Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c0a;
      --panel-bg: rgba(22, 17, 14, 0.85);
      --card-bg: #1c1612;
      --paper: #e8dfd1;
      --paper-dark: #c2b59b;
      --gold: #c5a059;
      --gold-bright: #e6c687;
      --crimson: #6b1d1d;
      --crimson-hover: #822424;
      --border-gold: rgba(197, 160, 89, 0.3);
      --font-title: 'Cinzel', serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(107, 29, 29, 0.15), transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(197, 160, 89, 0.08), transparent 50%);
      color: var(--paper);
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 40px;
      position: relative;
    }

    header::after {
      content: "🕮";
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-dark);
      padding: 0 15px;
      color: var(--gold);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.5rem;
      letter-spacing: 3px;
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }

    .subtitle {
      font-style: italic;
      color: var(--paper-dark);
      font-size: 1.1rem;
    }

    .audio-shelf {
      background: var(--panel-bg);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 35px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .ambient-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      color: var(--paper);
      padding: 12px;
      border-radius: 4px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .ambient-btn:hover {
      background: var(--crimson);
      border-color: var(--gold);
      color: #fff;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      font-family: var(--font-title);
      color: var(--gold);
      font-size: 1.3rem;
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--border-gold);
      padding-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: rgba(15, 12, 10, 0.7);
      border: 1px solid var(--border-gold);
      color: var(--paper);
      padding: 12px 14px;
      font-family: var(--font-serif);
      font-size: 1rem;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold-bright);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.3);
    }

    .submit-btn {
      background: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 12px 24px;
      font-family: var(--font-title);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: var(--gold-bright);
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      padding: 18px;
      border-radius: 4px;
      position: relative;
    }

    .book-title {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--gold-bright);
      margin-bottom: 4px;
    }

    .book-author {
      font-style: italic;
      color: var(--paper-dark);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .quote-box {
      font-style: italic;
      border-left: 3px solid var(--gold);
      padding-left: 15px;
      margin-bottom: 15px;
      color: var(--paper-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BIBLIOTHECA OBSCURA</h1>
      <p class="subtitle">"Veritas in Tenebris — Le savoir grandit dans l'ombre"</p>
    </header>

    <!-- Ambiance Sonore -->
    <div class="audio-shelf">
      <button class="ambient-btn" onclick="toggleAudio('rain')">🌧️ Pluie sur les vitres</button>
      <button class="ambient-btn" onclick="toggleAudio('fire')">🔥 Feu de cheminée</button>
      <button class="ambient-btn" onclick="toggleAudio('clock')">🕰️ Horloge ancienne</button>
    </div>

    <!-- Formulaire d'ajout -->
    <div class="card">
      <h2>📜 Consigner une Lecture</h2>
      <input type="text" id="bookTitle" placeholder="Titre de l'ouvrage...">
      <input type="text" id="bookAuthor" placeholder="Auteur / Écrivain...">
      <textarea id="bookNotes" rows="3" placeholder="Notes, réflexions et impressions..."></textarea>
      <button class="submit-btn" onclick="addBook()">Ajouter à la bibliothèque</button>
    </div>

    <!-- Liste des livres -->
    <div class="card">
      <h2>📚 Ouvrages Répertoriés</h2>
      <div class="book-grid" id="bookGrid"></div>
    </div>

    <!-- Citation -->
    <div class="card">
      <h2>✒️ Citation de la Nuit</h2>
      <div class="quote-box">
        "Nous lisons pour savoir que nous ne sommes pas seuls." — C.S. Lewis
      </div>
    </div>
  </div>

  <script>
    let books = JSON.parse(localStorage.getItem('da_books') || '[]');

    function saveAndRender() {
      localStorage.setItem('da_books', JSON.stringify(books));
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      if (books.length === 0) {
        grid.innerHTML = '<p style="color: var(--paper-dark); font-style: italic;">Aucun livre consigné pour le moment...</p>';
        return;
      }

      books.forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author}</div>
          <p style="font-size: 0.95rem; color: var(--paper);">${book.notes}</p>
          <button onclick="deleteBook(${index})" style="background:none; border:none; color: var(--crimson); cursor:pointer; font-size:0.85rem; margin-top:12px; font-weight:bold;">Supprimer</button>
        `;
        grid.appendChild(card);
      });
    }

    function addBook() {
      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      const notes = document.getElementById('bookNotes').value.trim();

      if (!title) return alert("Veuillez entrer au moins un titre.");

      books.push({ title, author, notes });
      document.getElementById('bookTitle').value = '';
      document.getElementById('bookAuthor').value = '';
      document.getElementById('bookNotes').value = '';
      saveAndRender();
    }

    function deleteBook(index) {
      books.splice(index, 1);
      saveAndRender();
    }

    function toggleAudio(type) {
      alert(`Ambiance "${type}" activée !`);
    }

    // Premier rendu
    saveAndRender();
  </script>

</body>
</html>
