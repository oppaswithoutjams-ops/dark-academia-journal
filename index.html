<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliotheca Obscura — Dark Academia Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c0a;
      --panel-bg: rgba(22, 17, 14, 0.85);
      --card-bg: #1c1612;
      --paper: #e8dfd1;
      --paper-dark: #c2b59b;
      --gold: #c5a059;
      --gold-bright: #e6c687;
      --crimson: #6b1d1d;
      --crimson-hover: #822424;
      --border-gold: rgba(197, 160, 89, 0.3);
      --border-subtle: rgba(232, 223, 209, 0.1);
      --font-title: 'Cinzel', serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(107, 29, 29, 0.15), transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(197, 160, 89, 0.08), transparent 50%);
      color: var(--paper);
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 40px;
      position: relative;
    }

    header::after {
      content: "🕮";
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-dark);
      padding: 0 15px;
      color: var(--gold);
    }

    h1 {
      font-family: var(--font-title);
      font-size: 2.8rem;
      letter-spacing: 3px;
      color: var(--gold-bright);
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }

    .subtitle {
      font-style: italic;
      color: var(--paper-dark);
      font-size: 1.2rem;
    }

    .audio-shelf {
      background: var(--panel-bg);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 35px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .ambient-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      color: var(--paper);
      padding: 12px;
      border-radius: 4px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      cursor: pointer;
